<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM Live Master Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --doc-primary: #1e3a8a;
            --form-primary: #0f766e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 50px; user-select: text; }
        
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 22px 20px;
            text-align: center;
        }
        .header.form-theme { background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%); }
        .header h1 { font-size: 22px; font-weight: 800; }
        
        .sync-badge { display: inline-block; font-size: 11px; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 12px; margin-top: 4px; }

        .nav-switch { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active { background: white; color: #0f172a; }

        .main-container { max-width: 1400px; margin: 18px auto 0 auto; padding: 0 16px; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 14px; }
        .search-input {
            flex: 1;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--card-bg);
        }
        .search-input:focus { border-color: #0284c7; background: #fff; }
        .btn-add {
            background: #059669;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-add:hover { background: #047857; }

        .chips-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; }
        .chips-bar::-webkit-scrollbar { height: 5px; }
        .chips-bar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .filter-chip {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .filter-chip:hover { background: #e2e8f0; color: var(--text-main); }
        .filter-chip.active { background: var(--doc-primary); color: white; border-color: var(--doc-primary); }
        .theme-form .filter-chip.active { background: var(--form-primary); border-color: var(--form-primary); }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
        .item-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            border-left: 5px solid #0284c7;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .card-id { font-size: 11px; font-weight: 800; color: #0284c7; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; }
        .card-title { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; padding-right: 50px; }
        .card-sub { font-size: 13px; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; }
        .card-info { font-size: 12.5px; color: var(--text-sub); margin-top: 3px; }

        .card-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
        .action-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 6px; font-size: 11px; cursor: pointer; font-weight: 700; }
        .action-btn:hover { background: #e2e8f0; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: white; border-radius: 12px; padding: 20px; max-width: 440px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .form-control { width: 100%; padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; margin: 4px 0 10px 0; outline: none; }
        .form-control:focus { border-color: #0284c7; }
    </style>
</head>
<body>

    <div class="header" id="mainHeader">
        <h1>🏥 Shree Ganesh Medicals — Master Lookup Portal</h1>
        <div class="sync-badge" id="syncStatus">🔄 Loading Database...</div>
        
        <div class="nav-switch">
            <button class="nav-btn active" id="btnDoc" onclick="switchTab('DOCTORS')">👨‍⚕️ Doctors Directory</button>
            <button class="nav-btn" id="btnForm" onclick="switchTab('FORMULAS')">🧪 Formulas Directory</button>
        </div>
    </div>

    <div class="main-container">
        <div class="top-bar">
            <input type="text" id="mainSearch" class="search-input" onkeyup="applyFilters()" placeholder="🔍 Type to search instantly..." autofocus>
            <button class="btn-add" id="btnAdd" onclick="openAddModal()">➕ Add Doctor</button>
        </div>

        <div class="chips-bar" id="chipsBar"></div>
        <div class="items-grid" id="itemsGrid"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modalBox">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom:12px; font-size: 17px; font-weight:800;">➕ Add Details</h3>
            <form id="itemForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="mId">
                <div id="dynamicInputs"></div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
                    <button type="button" onclick="closeModal()" style="padding:6px 14px; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
                    <button type="submit" id="btnSave" style="padding:6px 18px; background:#059669; color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const docCategories = {
            "CARDIO": { name: "Cardiology", icon: "❤️", color: "#dc2626" },
            "DENTAL": { name: "Dental", icon: "🦷", color: "#0284c7" },
            "NEURO": { name: "Neuro", icon: "🧠", color: "#7c3aed" },
            "PEDIATRIC": { name: "Pediatric", icon: "👶", color: "#db2777" },
            "ENT": { name: "ENT", icon: "👂", color: "#ea580c" },
            "ORTHO": { name: "Orthopedics", icon: "🦴", color: "#d97706" },
            "PHYSICIAN": { name: "Physician", icon: "🩺", color: "#059669" },
            "MBBS": { name: "General (MBBS)", icon: "👨‍⚕️", color: "#0d9488" },
            "OTHER": { name: "Specialists", icon: "📋", color: "#4b5563" }
        };

        const formulaCategories = {
            "DIABETES": { name: "Diabetes", icon: "🩸", color: "#dc2626" },
            "CARDIAC": { name: "Cardiac & BP", icon: "❤️", color: "#e11d48" },
            "ANTIBIOTIC": { name: "Antibiotics", icon: "🦠", color: "#0284c7" },
            "PAIN": { name: "Pain Relief", icon: "💊", color: "#d97706" },
            "GASTRO": { name: "Gastro", icon: "🧪", color: "#059669" },
            "RESPIRATORY": { name: "Cough & Cold", icon: "🫁", color: "#0891b2" },
            "NEURO": { name: "Neuro", icon: "🧠", color: "#7c3aed" },
            "DERMA": { name: "Dermatology", icon: "🧴", color: "#9333ea" },
            "ORTHO": { name: "Bone & Joint", icon: "🦴", color: "#ea580c" },
            "VITAMIN": { name: "Vitamins", icon: "✨", color: "#16a34a" },
            "OTHER": { name: "General Salts", icon: "📋", color: "#4b5563" }
        };

        let activeTab = 'DOCTORS';
        let currentFilter = 'ALL';
        let rawBaseData = { doctors: [], formulas: [] };
        let activeList = [];

        async function loadMasterData() {
            document.getElementById("syncStatus").innerText = "🔄 Loading from data.json...";
            try {
                // Direct relative fetch (No GitHub token or API limits)
                const res = await fetch('./data.json?v=' + Date.now());
                rawBaseData = await res.json();
                document.getElementById("syncStatus").innerText = `✅ Data Loaded (${rawBaseData.doctors.length} Doctors, ${rawBaseData.formulas.length} Salts)`;
                prepareDataset();
            } catch (err) {
                console.error(err);
                document.getElementById("syncStatus").innerText = "⚠️ Reading local storage...";
                prepareDataset();
            }
        }

        function prepareDataset() {
            if (activeTab === 'DOCTORS') {
                const custom = JSON.parse(localStorage.getItem("sgm_cust_docs") || "[]");
                const edits = JSON.parse(localStorage.getItem("sgm_edit_docs") || "{}");
                let merged = (rawBaseData.doctors || []).map(d => edits[d.id] ? { ...d, ...edits[d.id] } : d);
                activeList = [...custom, ...merged];
            } else {
                const custom = JSON.parse(localStorage.getItem("sgm_cust_forms") || "[]");
                const edits = JSON.parse(localStorage.getItem("sgm_edit_forms") || "{}");
                let merged = (rawBaseData.formulas || []).map(f => edits[f.id] ? { ...f, ...edits[f.id] } : f);
                activeList = [...custom, ...merged];
            }
            renderUI();
        }

        function switchTab(tab) {
            activeTab = tab;
            currentFilter = 'ALL';
            document.getElementById("mainSearch").value = "";
            document.getElementById("btnDoc").className = tab === 'DOCTORS' ? 'nav-btn active' : 'nav-btn';
            document.getElementById("btnForm").className = tab === 'FORMULAS' ? 'nav-btn active' : 'nav-btn';
            document.getElementById("mainHeader").className = tab === 'DOCTORS' ? 'header' : 'header form-theme';
            document.body.className = tab === 'DOCTORS' ? '' : 'theme-form';
            document.getElementById("btnAdd").innerText = tab === 'DOCTORS' ? "➕ Add Doctor" : "➕ Add Formula";
            prepareDataset();
        }

        function renderUI() {
            renderChips();
            renderGrid();
        }

        function renderChips() {
            const metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let counts = {};
            activeList.forEach(i => counts[i.cat_key] = (counts[i.cat_key] || 0) + 1);

            let html = `<button class="filter-chip ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL', this)">🌟 All (${activeList.length})</button>`;
            for (let [k, meta] of Object.entries(metaMap)) {
                if (counts[k]) {
                    html += `<button class="filter-chip ${currentFilter === k ? 'active' : ''}" onclick="setFilter('${k}', this)">${meta.icon} ${meta.name} (${counts[k]})</button>`;
                }
            }
            document.getElementById("chipsBar").innerHTML = html;
        }

        function renderGrid() {
            const metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let html = '';

            activeList.forEach(item => {
                let meta = metaMap[item.cat_key] || metaMap["OTHER"];
                let searchStr = (activeTab === 'DOCTORS' ? `${item.display_name} ${item.raw_name_qual} ${item.address} ${item.phone}` : item.formula_name).toLowerCase();
                let delBtn = item.is_custom ? `<button class="action-btn" onclick="deleteItem('${item.id}')">🗑️</button>` : '';

                if (activeTab === 'DOCTORS') {
                    html += `
                    <div class="item-card" data-cat="${item.cat_key}" data-search="${searchStr}" style="border-left-color: ${meta.color};">
                        <div class="card-controls">
                            <button class="action-btn" onclick="openEditModal('${item.id}')">✏️</button>
                            ${delBtn}
                        </div>
                        <div>
                            <div class="card-header">
                                <span class="card-id">ID: ${item.id}</span>
                                <span style="font-size:11.5px; font-weight:700;">${meta.icon} ${meta.name}</span>
                            </div>
                            <div class="card-title">${item.display_name}</div>
                            <div class="card-sub">📋 ${item.raw_name_qual || '-'}</div>
                            <div class="card-info">📍 ${item.address || 'Gondia'}</div>
                            <div class="card-info">📞 <b>${item.phone || '-'}</b></div>
                        </div>
                    </div>`;
                } else {
                    html += `
                    <div class="item-card" data-cat="${item.cat_key}" data-search="${searchStr}" style="border-left-color: ${meta.color};">
                        <div class="card-controls">
                            <button class="action-btn" onclick="openEditModal('${item.id}')">✏️</button>
                            ${delBtn}
                        </div>
                        <div>
                            <div class="card-header">
                                <span class="card-id" style="color:#0f766e; background:#ccfbf1;">ID: ${item.id}</span>
                                <span style="font-size:11.5px; font-weight:700;">${meta.icon} ${meta.name}</span>
                            </div>
                            <div class="card-title">${item.formula_name}</div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById("itemsGrid").innerHTML = html;
            applyFilters();
        }

        function setFilter(cat, btn) {
            currentFilter = cat;
            let chips = document.getElementsByClassName("filter-chip");
            for (let c of chips) c.classList.remove("active");
            btn.classList.add("active");
            applyFilters();
        }

        function applyFilters() {
            let q = document.getElementById("mainSearch").value.toLowerCase().trim();
            let cards = document.getElementsByClassName("item-card");

            for (let c of cards) {
                let cat = c.getAttribute("data-cat");
                let search = c.getAttribute("data-search");
                let matchesCat = (currentFilter === 'ALL' || cat === currentFilter);
                let matchesSearch = (q === "" || search.includes(q));
                c.style.display = (matchesCat && matchesSearch) ? "flex" : "none";
            }
        }

        function openAddModal() {
            document.getElementById("itemForm").reset();
            document.getElementById("mId").value = "";
            document.getElementById("modalTitle").innerText = activeTab === 'DOCTORS' ? "➕ Add Doctor" : "➕ Add Formula";
            
            let metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let opt = Object.entries(metaMap).map(([k, v]) => `<option value="${k}">${v.icon} ${v.name}</option>`).join('');

            if (activeTab === 'DOCTORS') {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Doctor Name:</label><input id="mName" class="form-control" required placeholder="Dr. ...">
                    <label style="font-size:12px; font-weight:700;">Degree / Qual:</label><input id="mQual" class="form-control" required placeholder="MBBS/BDS">
                    <label style="font-size:12px; font-weight:700;">Category:</label><select id="mCat" class="form-control">${opt}</select>
                    <label style="font-size:12px; font-weight:700;">Clinic Address & Phone:</label>
                    <input id="mAddr" class="form-control" placeholder="Clinic Name, Gondia">
                    <input id="mPhone" class="form-control" placeholder="Phone Number">
                `;
            } else {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Formula / Salt Name:</label><input id="mName" class="form-control" required placeholder="e.g. PARACETAMOL 500MG">
                    <label style="font-size:12px; font-weight:700;">Category:</label><select id="mCat" class="form-control">${opt}</select>
                `;
            }
            document.getElementById("modalBox").style.display = "flex";
        }

        function openEditModal(id) {
            const item = activeList.find(i => i.id === id);
            if (!item) return;

            document.getElementById("mId").value = item.id;
            document.getElementById("modalTitle").innerText = "✏️ Edit Details";
            
            let metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let opt = Object.entries(metaMap).map(([k, v]) => `<option value="${k}" ${k===item.cat_key?'selected':''}>${v.icon} ${v.name}</option>`).join('');

            if (activeTab === 'DOCTORS') {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Doctor Name:</label><input id="mName" class="form-control" required value="${item.display_name}">
                    <label style="font-size:12px; font-weight:700;">Degree / Qual:</label><input id="mQual" class="form-control" required value="${item.raw_name_qual}">
                    <label style="font-size:12px; font-weight:700;">Category:</label><select id="mCat" class="form-control">${opt}</select>
                    <label style="font-size:12px; font-weight:700;">Clinic Address & Phone:</label>
                    <input id="mAddr" class="form-control" value="${item.address||''}">
                    <input id="mPhone" class="form-control" value="${item.phone||''}">
                `;
            } else {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Formula / Salt Name:</label><input id="mName" class="form-control" required value="${item.formula_name}">
                    <label style="font-size:12px; font-weight:700;">Category:</label><select id="mCat" class="form-control">${opt}</select>
                `;
            }
            document.getElementById("modalBox").style.display = "flex";
        }

        function closeModal() { document.getElementById("modalBox").style.display = "none"; }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("mId").value;
            const name = document.getElementById("mName").value.trim();
            const cat = document.getElementById("mCat").value;

            if (activeTab === 'DOCTORS') {
                if (id) {
                    let edits = JSON.parse(localStorage.getItem("sgm_edit_docs") || "{}");
                    edits[id] = {
                        display_name: name.startsWith("Dr.") ? name : "Dr. " + name,
                        raw_name_qual: document.getElementById("mQual").value.trim(),
                        cat_key: cat,
                        address: document.getElementById("mAddr").value.trim() || 'Gondia',
                        phone: document.getElementById("mPhone").value.trim() || '-'
                    };
                    localStorage.setItem("sgm_edit_docs", JSON.stringify(edits));
                } else {
                    let custom = JSON.parse(localStorage.getItem("sgm_cust_docs") || "[]");
                    custom.unshift({
                        id: 'CUST_' + Date.now(),
                        display_name: name.startsWith("Dr.") ? name : "Dr. " + name,
                        raw_name_qual: document.getElementById("mQual").value.trim(),
                        cat_key: cat,
                        address: document.getElementById("mAddr").value.trim() || 'Gondia',
                        phone: document.getElementById("mPhone").value.trim() || '-',
                        is_custom: true
                    });
                    localStorage.setItem("sgm_cust_docs", JSON.stringify(custom));
                }
            } else {
                if (id) {
                    let edits = JSON.parse(localStorage.getItem("sgm_edit_forms") || "{}");
                    edits[id] = {
                        formula_name: name.toUpperCase(),
                        cat_key: cat
                    };
                    localStorage.setItem("sgm_edit_forms", JSON.stringify(edits));
                } else {
                    let custom = JSON.parse(localStorage.getItem("sgm_cust_forms") || "[]");
                    custom.unshift({
                        id: 'FORM_' + Date.now(),
                        formula_name: name.toUpperCase(),
                        cat_key: cat,
                        is_custom: true
                    });
                    localStorage.setItem("sgm_cust_forms", JSON.stringify(custom));
                }
            }

            closeModal();
            prepareDataset();
        }

        function deleteItem(id) {
            if (confirm("Kya aap ise delete karna chahte hain?")) {
                if (activeTab === 'DOCTORS') {
                    let custom = JSON.parse(localStorage.getItem("sgm_cust_docs") || "[]");
                    custom = custom.filter(d => d.id !== id);
                    localStorage.setItem("sgm_cust_docs", JSON.stringify(custom));
                } else {
                    let custom = JSON.parse(localStorage.getItem("sgm_cust_forms") || "[]");
                    custom = custom.filter(f => f.id !== id);
                    localStorage.setItem("sgm_cust_forms", JSON.stringify(custom));
                }
                prepareDataset();
            }
        }

        window.onload = loadMasterData;
    </script>
</body>
</html>
