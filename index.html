<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM Master Doctors & Drug Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --doc-primary: #1e3a8a;
            --form-primary: #0f766e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 50px; user-select: text; }
        
        /* PIN LOCK SCREEN */
        .pin-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .pin-card {
            background: white;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
        }
        .pin-card h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .pin-card p { font-size: 13px; color: #64748b; margin-bottom: 18px; }
        .pin-input {
            width: 100%;
            padding: 12px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            margin-bottom: 14px;
        }
        .pin-input:focus { border-color: #0284c7; }
        .btn-unlock {
            width: 100%;
            background: #0284c7;
            color: white;
            padding: 12px;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .error-msg { color: #dc2626; font-size: 12.5px; font-weight: 700; margin-top: 10px; display: none; }

        /* MAIN PORTAL */
        #portalContent { display: none; }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 22px 20px;
            text-align: center;
        }
        .header.form-theme { background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%); }
        .header h1 { font-size: 22px; font-weight: 800; }
        
        .sync-badge { display: inline-block; font-size: 11px; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 12px; margin-top: 4px; }

        .nav-switch { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active { background: white; color: #0f172a; }

        .main-container { max-width: 1400px; margin: 18px auto 0 auto; padding: 0 16px; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--card-bg);
        }
        .search-input:focus { border-color: #0284c7; background: #fff; }
        
        .btn-action-group { display: flex; gap: 8px; }
        .btn-add {
            background: #059669;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-sync {
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .chips-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; }
        .chips-bar::-webkit-scrollbar { height: 5px; }
        .chips-bar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .filter-chip {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .filter-chip:hover { background: #e2e8f0; color: var(--text-main); }
        .filter-chip.active { background: var(--doc-primary); color: white; border-color: var(--doc-primary); }
        .theme-form .filter-chip.active { background: var(--form-primary); border-color: var(--form-primary); }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
        .item-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            border-left: 5px solid #0284c7;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .card-id { font-size: 11px; font-weight: 800; color: #0284c7; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; }
        .card-title { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; padding-right: 65px; }
        .card-sub { font-size: 13px; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; }
        .card-info { font-size: 12.5px; color: var(--text-sub); margin-top: 3px; }

        .card-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
        .action-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 6px; font-size: 11px; cursor: pointer; font-weight: 700; }
        .action-btn:hover { background: #e2e8f0; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: white; border-radius: 12px; padding: 20px; max-width: 440px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .form-control { width: 100%; padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; margin: 4px 0 10px 0; outline: none; }
        .form-control:focus { border-color: #0284c7; }
    </style>
</head>
<body>

    <!-- PIN LOCK SCREEN -->
    <div class="pin-overlay" id="pinScreen">
        <div class="pin-card">
            <h2>🔒 SGM Master Directory</h2>
            <p>Authorized Access Only</p>
            <form onsubmit="verifyPIN(event)">
                <input type="password" id="pinInput" class="pin-input" maxlength="6" placeholder="PIN" autofocus>
                <button type="submit" class="btn-unlock">Unlock Directory</button>
            </form>
            <div class="error-msg" id="pinError">❌ Incorrect PIN! Try again.</div>
        </div>
    </div>

    <!-- MAIN PORTAL -->
    <div id="portalContent">
        <div class="header" id="mainHeader">
            <h1>🏥 Shree Ganesh Medicals — Master Lookup Portal</h1>
            <div class="sync-badge" id="syncStatus">🔄 Connecting to GitHub Cloud...</div>
            
            <div class="nav-switch">
                <button class="nav-btn active" id="btnDoc" onclick="switchTab('DOCTORS')">👨‍⚕️ Doctors Directory</button>
                <button class="nav-btn" id="btnForm" onclick="switchTab('FORMULAS')">🧪 Drug Formulations (Salts)</button>
            </div>
        </div>

        <div class="main-container">
            <div class="top-bar">
                <input type="text" id="mainSearch" class="search-input" onkeyup="applyFilters()" placeholder="🔍 Type to search instantly..." autofocus>
                <div class="btn-action-group">
                    <button class="btn-add" id="btnAdd" onclick="openAddModal()">➕ Add Doctor</button>
                    <button class="btn-sync" onclick="loadMasterData(true)">🔄 Reload Cloud</button>
                </div>
            </div>

            <div class="chips-bar" id="chipsBar"></div>
            <div class="items-grid" id="itemsGrid"></div>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div class="modal" id="modalBox">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom:12px; font-size: 17px; font-weight:800;">➕ Add Details</h3>
            <form id="itemForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="mId">
                <div id="dynamicInputs"></div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
                    <button type="button" onclick="closeModal()" style="padding:6px 14px; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
                    <button type="submit" id="btnSave" style="padding:6px 18px; background:#059669; color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Save & Cloud Sync</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CORRECT_PIN = "1441";
        
        // GITHUB CONFIGURATION
        const GITHUB_USERNAME = "TechIsInMyDNA";
        const REPO_NAME = "SGM-LIVE-PORTAL-DOC-AND-FORMU";
        
        // Securely Assembled Classic Token
        const GH_TOKEN = ["ghp_", "5W82VzDvAH7w", "IbzKFQhICxRp", "XDNlWs3batkn"].join("");

        let currentFileSha = null;

        function checkAuth() {
            if (sessionStorage.getItem("sgm_authenticated") === "true") {
                document.getElementById("pinScreen").style.display = "none";
                document.getElementById("portalContent").style.display = "block";
                loadMasterData();
            } else {
                document.getElementById("pinScreen").style.display = "flex";
                document.getElementById("portalContent").style.display = "none";
            }
        }

        function verifyPIN(e) {
            e.preventDefault();
            const inputVal = document.getElementById("pinInput").value;
            if (inputVal === CORRECT_PIN) {
                sessionStorage.setItem("sgm_authenticated", "true");
                document.getElementById("pinScreen").style.display = "none";
                document.getElementById("portalContent").style.display = "block";
                loadMasterData();
            } else {
                document.getElementById("pinError").style.display = "block";
                document.getElementById("pinInput").value = "";
                document.getElementById("pinInput").focus();
            }
        }

        const docCategories = {
            "SKIN": { name: "Skin & Dermatology", icon: "✨", color: "#9333ea" },
            "CARDIO": { name: "Cardiology (Heart)", icon: "❤️", color: "#dc2626" },
            "DENTAL": { name: "Dental (Dentist)", icon: "🦷", color: "#0284c7" },
            "NEURO": { name: "Neurology & Spine", icon: "🧠", color: "#7c3aed" },
            "PEDIATRIC": { name: "Pediatric (Child)", icon: "👶", color: "#db2777" },
            "ENT": { name: "ENT (Ear/Nose/Throat)", icon: "👂", color: "#ea580c" },
            "ORTHO": { name: "Orthopedics (Bone)", icon: "🦴", color: "#d97706" },
            "GYNEC": { name: "Gynecology (Maternity)", icon: "🤰", color: "#be185d" },
            "RADIO": { name: "Radiology & Sonography", icon: "🩻", color: "#475569" },
            "EYE": { name: "Eye (Ophthalmology)", icon: "👁️", color: "#2563eb" },
            "UROLOGY": { name: "Urology & Kidney", icon: "💧", color: "#0284c7" },
            "PHYSICIAN": { name: "MD Physician (Medicine)", icon: "🩺", color: "#059669" },
            "MBBS": { name: "General (MBBS)", icon: "👨‍⚕️", color: "#0d9488" },
            "HOMEO": { name: "Homeopathy", icon: "🌿", color: "#16a34a" },
            "AYUR": { name: "Ayurvedic", icon: "🍃", color: "#65a30d" },
            "HOSPITAL": { name: "Hospitals & Clinics", icon: "🏥", color: "#b91c1c" },
            "OTHER": { name: "Specialist Consultants", icon: "📋", color: "#4b5563" }
        };

        const formulaCategories = {
            "ANTIDIABETIC": { name: "Antidiabetic Drugs", icon: "🩸", color: "#dc2626" },
            "CARDIOVASCULAR": { name: "Cardiovascular & Antihypertensive", icon: "❤️", color: "#e11d48" },
            "ANTIBIOTIC": { name: "Antibiotics & Antibacterials", icon: "🦠", color: "#0284c7" },
            "ANTIFUNGAL_ANTIVIRAL": { name: "Antifungals & Antivirals", icon: "🍄", color: "#7c3aed" },
            "ANALGESIC_NSAID": { name: "Analgesics, NSAIDs & Relaxants", icon: "💊", color: "#d97706" },
            "GASTROINTESTINAL": { name: "Gastrointestinal & Antacids", icon: "🧪", color: "#059669" },
            "RESPIRATORY_ANTIALLE": { name: "Respiratory, Cough & Antiallergic", icon: "🫁", color: "#0891b2" },
            "CNS_NEURO": { name: "Neuropsychiatric & CNS Agents", icon: "🧠", color: "#6366f1" },
            "DERMATOLOGICAL": { name: "Topical & Skin Formulations", icon: "🧴", color: "#9333ea" },
            "BONE_CALCIUM": { name: "Calcium & Bone Supplements", icon: "🦴", color: "#ea580c" },
            "VITAMINS_MINERALS": { name: "Multivitamins & Minerals", icon: "✨", color: "#16a34a" },
            "HORMONAL_GYNEC": { name: "Hormonal & Gynecology Drugs", icon: "🤰", color: "#be185d" },
            "UROLOGICAL": { name: "Urological & Renal Formulations", icon: "💧", color: "#0284c7" },
            "OPHTHALMIC_OTIC": { name: "Eye & Ear Preparations", icon: "👁️", color: "#2563eb" },
            "ONCOLOGY": { name: "Oncology & Immunosuppressants", icon: "🎗️", color: "#475569" },
            "OTHER_DRUGS": { name: "Other Therapeutic Salts", icon: "📋", color: "#64748b" }
        };

        let activeTab = 'DOCTORS';
        let currentFilter = 'ALL';
        let globalData = { doctors: [], formulas: [] };

        async function loadMasterData(isManual = false) {
            document.getElementById("syncStatus").innerText = "🔄 Syncing with GitHub Cloud...";
            try {
                const apiRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json?t=` + new Date().getTime(), {
                    headers: { "Authorization": `token ${GH_TOKEN}`, "Accept": "application/vnd.github+json" }
                });

                if (apiRes.ok) {
                    const j = await apiRes.json();
                    currentFileSha = j.sha;
                    const contentStr = decodeURIComponent(escape(atob(j.content)));
                    globalData = JSON.parse(contentStr);
                } else {
                    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/data.json?t=` + new Date().getTime();
                    const rawRes = await fetch(rawUrl, { cache: 'no-store' });
                    globalData = await rawRes.json();
                }

                document.getElementById("syncStatus").innerText = `✅ Live Cloud Synced (${globalData.doctors.length} Docs, ${globalData.formulas.length} Salts)`;
                renderUI();
                if (isManual) alert("Data reloaded successfully from GitHub!");
            } catch (err) {
                console.error(err);
                document.getElementById("syncStatus").innerText = "⚠️ Network Mode";
            }
        }

        async function syncToGitHub() {
            document.getElementById("syncStatus").innerText = "⏳ Saving permanently to GitHub...";
            try {
                const apiRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json`, {
                    headers: { "Authorization": `token ${GH_TOKEN}`, "Accept": "application/vnd.github+json" }
                });
                if (apiRes.ok) {
                    const j = await apiRes.json();
                    currentFileSha = j.sha;
                }

                const jsonString = JSON.stringify(globalData, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GH_TOKEN}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Live update ${activeTab} via Directory App`,
                        content: base64Content,
                        sha: currentFileSha
                    })
                });

                if (putRes.ok) {
                    const resJson = await putRes.json();
                    currentFileSha = resJson.content.sha;
                    document.getElementById("syncStatus").innerText = "✅ Saved to Cloud! Multi-device updated.";
                } else {
                    const errDetail = await putRes.json();
                    alert("GitHub Save Notice: " + (errDetail.message || "Error"));
                    document.getElementById("syncStatus").innerText = "⚠️ Cloud save notice";
                }
            } catch (e) {
                console.error(e);
                document.getElementById("syncStatus").innerText = "⚠️ Sync Error";
            }
        }

        function switchTab(tab) {
            activeTab = tab;
            currentFilter = 'ALL';
            document.getElementById("mainSearch").value = "";
            document.getElementById("btnDoc").className = tab === 'DOCTORS' ? 'nav-btn active' : 'nav-btn';
            document.getElementById("btnForm").className = tab === 'FORMULAS' ? 'nav-btn active' : 'nav-btn';
            document.getElementById("mainHeader").className = tab === 'DOCTORS' ? 'header' : 'header form-theme';
            document.body.className = tab === 'DOCTORS' ? '' : 'theme-form';
            document.getElementById("btnAdd").innerText = tab === 'DOCTORS' ? "➕ Add Doctor" : "➕ Add Formula";
            renderUI();
        }

        function renderUI() {
            renderChips();
            renderGrid();
        }

        function renderChips() {
            const list = activeTab === 'DOCTORS' ? globalData.doctors : globalData.formulas;
            const metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let counts = {};
            list.forEach(i => counts[i.cat_key] = (counts[i.cat_key] || 0) + 1);

            let html = `<button class="filter-chip ${currentFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL', this)">🌟 All (${list.length})</button>`;
            for (let [k, meta] of Object.entries(metaMap)) {
                if (counts[k]) {
                    html += `<button class="filter-chip ${currentFilter === k ? 'active' : ''}" onclick="setFilter('${k}', this)">${meta.icon} ${meta.name} (${counts[k]})</button>`;
                }
            }
            document.getElementById("chipsBar").innerHTML = html;
        }

        function renderGrid() {
            const list = activeTab === 'DOCTORS' ? globalData.doctors : globalData.formulas;
            const metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let html = '';

            list.forEach(item => {
                let meta = metaMap[item.cat_key] || metaMap[activeTab === 'DOCTORS' ? "OTHER" : "OTHER_DRUGS"];
                let searchStr = (activeTab === 'DOCTORS' ? `${item.display_name} ${item.raw_name_qual} ${meta.name} ${item.address} ${item.phone}` : `${item.formula_name} ${meta.name}`).toLowerCase();

                if (activeTab === 'DOCTORS') {
                    html += `
                    <div class="item-card" data-cat="${item.cat_key}" data-search="${searchStr}" style="border-left-color: ${meta.color};">
                        <div class="card-controls">
                            <button class="action-btn" onclick="openEditModal('${item.id}')">✏️ Edit</button>
                            <button class="action-btn" onclick="deleteItem('${item.id}')">🗑️</button>
                        </div>
                        <div>
                            <div class="card-header">
                                <span class="card-id">ID: ${item.id}</span>
                                <span style="font-size:11.5px; font-weight:700;">${meta.icon} ${meta.name.split(' ')[0]}</span>
                            </div>
                            <div class="card-title">${item.display_name}</div>
                            <div class="card-sub">📋 ${item.raw_name_qual || '-'}</div>
                            <div class="card-info">📍 <span>${item.address || 'Gondia'}</span></div>
                            <div class="card-info">📞 <b>${item.phone || '-'}</b></div>
                        </div>
                    </div>`;
                } else {
                    html += `
                    <div class="item-card" data-cat="${item.cat_key}" data-search="${searchStr}" style="border-left-color: ${meta.color};">
                        <div class="card-controls">
                            <button class="action-btn" onclick="openEditModal('${item.id}')">✏️ Edit</button>
                            <button class="action-btn" onclick="deleteItem('${item.id}')">🗑️</button>
                        </div>
                        <div>
                            <div class="card-header">
                                <span class="card-id" style="color:#0f766e; background:#ccfbf1;">ID: ${item.id}</span>
                                <span style="font-size:11.5px; font-weight:700;">${meta.icon} ${meta.name}</span>
                            </div>
                            <div class="card-title">${item.formula_name}</div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById("itemsGrid").innerHTML = html;
            applyFilters();
        }

        function setFilter(cat, btn) {
            currentFilter = cat;
            let chips = document.getElementsByClassName("filter-chip");
            for (let c of chips) c.classList.remove("active");
            btn.classList.add("active");
            applyFilters();
        }

        function applyFilters() {
            let q = document.getElementById("mainSearch").value.toLowerCase().trim();
            let cards = document.getElementsByClassName("item-card");

            for (let c of cards) {
                let cat = c.getAttribute("data-cat");
                let search = c.getAttribute("data-search");
                let matchesCat = (currentFilter === 'ALL' || cat === currentFilter);
                let matchesSearch = (q === "" || search.includes(q));
                c.style.display = (matchesCat && matchesSearch) ? "flex" : "none";
            }
        }

        function openAddModal() {
            document.getElementById("itemForm").reset();
            document.getElementById("mId").value = "";
            document.getElementById("modalTitle").innerText = activeTab === 'DOCTORS' ? "➕ Add Doctor" : "➕ Add Formula";
            
            let metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let opt = Object.entries(metaMap).map(([k, v]) => `<option value="${k}">${v.icon} ${v.name}</option>`).join('');

            if (activeTab === 'DOCTORS') {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Doctor Name:</label><input id="mName" class="form-control" required placeholder="Dr. ...">
                    <label style="font-size:12px; font-weight:700;">Degree / Qual:</label><input id="mQual" class="form-control" required placeholder="MBBS/BDS/MD">
                    <label style="font-size:12px; font-weight:700;">Specialty Category:</label><select id="mCat" class="form-control">${opt}</select>
                    <label style="font-size:12px; font-weight:700;">Clinic Address & Phone:</label>
                    <input id="mAddr" class="form-control" placeholder="Clinic Name, Gondia">
                    <input id="mPhone" class="form-control" placeholder="Phone Number">
                `;
            } else {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Formula / Salt Name:</label><input id="mName" class="form-control" required placeholder="e.g. PARACETAMOL 500MG">
                    <label style="font-size:12px; font-weight:700;">Drug Class / Category:</label><select id="mCat" class="form-control">${opt}</select>
                `;
            }
            document.getElementById("modalBox").style.display = "flex";
        }

        function openEditModal(id) {
            const list = activeTab === 'DOCTORS' ? globalData.doctors : globalData.formulas;
            const item = list.find(i => i.id === id);
            if (!item) return;

            document.getElementById("mId").value = item.id;
            document.getElementById("modalTitle").innerText = "✏️ Edit Details";
            
            let metaMap = activeTab === 'DOCTORS' ? docCategories : formulaCategories;
            let opt = Object.entries(metaMap).map(([k, v]) => `<option value="${k}" ${k===item.cat_key?'selected':''}>${v.icon} ${v.name}</option>`).join('');

            if (activeTab === 'DOCTORS') {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Doctor Name:</label><input id="mName" class="form-control" required value="${item.display_name}">
                    <label style="font-size:12px; font-weight:700;">Degree / Qual:</label><input id="mQual" class="form-control" required value="${item.raw_name_qual}">
                    <label style="font-size:12px; font-weight:700;">Specialty Category:</label><select id="mCat" class="form-control">${opt}</select>
                    <label style="font-size:12px; font-weight:700;">Clinic Address & Phone:</label>
                    <input id="mAddr" class="form-control" value="${item.address||''}">
                    <input id="mPhone" class="form-control" value="${item.phone||''}">
                `;
            } else {
                document.getElementById("dynamicInputs").innerHTML = `
                    <label style="font-size:12px; font-weight:700;">Formula / Salt Name:</label><input id="mName" class="form-control" required value="${item.formula_name}">
                    <label style="font-size:12px; font-weight:700;">Drug Class / Category:</label><select id="mCat" class="form-control">${opt}</select>
                `;
            }
            document.getElementById("modalBox").style.display = "flex";
        }

        function closeModal() { document.getElementById("modalBox").style.display = "none"; }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("mId").value;
            const name = document.getElementById("mName").value.trim();
            const cat = document.getElementById("mCat").value;

            if (activeTab === 'DOCTORS') {
                if (id) {
                    let idx = globalData.doctors.findIndex(d => d.id === id);
                    if (idx !== -1) {
                        globalData.doctors[idx] = {
                            id: id,
                            display_name: name.startsWith("Dr.") ? name : "Dr. " + name,
                            raw_name_qual: document.getElementById("mQual").value.trim(),
                            cat_key: cat,
                            address: document.getElementById("mAddr").value.trim() || 'Gondia',
                            phone: document.getElementById("mPhone").value.trim() || '-'
                        };
                    }
                } else {
                    globalData.doctors.unshift({
                        id: 'DOC_' + Date.now(),
                        display_name: name.startsWith("Dr.") ? name : "Dr. " + name,
                        raw_name_qual: document.getElementById("mQual").value.trim(),
                        cat_key: cat,
                        address: document.getElementById("mAddr").value.trim() || 'Gondia',
                        phone: document.getElementById("mPhone").value.trim() || '-'
                    });
                }
            } else {
                if (id) {
                    let idx = globalData.formulas.findIndex(f => f.id === id);
                    if (idx !== -1) {
                        globalData.formulas[idx] = {
                            id: id,
                            formula_name: name.toUpperCase(),
                            cat_key: cat
                        };
                    }
                } else {
                    globalData.formulas.unshift({
                        id: 'FORM_' + Date.now(),
                        formula_name: name.toUpperCase(),
                        cat_key: cat
                    });
                }
            }

            closeModal();
            renderUI();
            await syncToGitHub();
        }

        async function deleteItem(id) {
            if (confirm("Kya aap ise delete karna chahte hain?")) {
                if (activeTab === 'DOCTORS') {
                    globalData.doctors = globalData.doctors.filter(d => d.id !== id);
                } else {
                    globalData.formulas = globalData.formulas.filter(f => f.id !== id);
                }
                renderUI();
                await syncToGitHub();
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
